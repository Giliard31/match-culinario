<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchCulinário 🍳 - O que tem na geladeira?</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ff4757">
    <style>
        :root { --primary: #ff4757; --bg: #f8f9fa; --card-bg: #ffffff; --text: #2f3542; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .wrapper { max-width: 600px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; }
        header h1 { color: var(--primary); margin: 0; font-size: 26px; }
        header p { color: #747d8c; font-size: 14px; margin-top: 5px; }
        
        .upload-box { background: var(--card-bg); border: 2px dashed #ced6e0; border-radius: 16px; padding: 30px 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .upload-box:hover { border-color: var(--primary); background: #fff5f5; }
        .btn-principal { background: var(--primary); color: white; border: none; padding: 14px 24px; font-size: 16px; border-radius: 30px; cursor: pointer; font-weight: bold; width: 100%; box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3); }
        
        #loading { display: none; text-align: center; margin: 20px 0; font-weight: bold; color: var(--primary); }
        
        .section-title { font-size: 18px; margin: 20px 0 10px 0; font-weight: bold; }
        .tags-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
        .tag { background: #ffeaa7; color: #d63031; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        
        .recipe-card { background: var(--card-bg); border-radius: 14px; padding: 18px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 5px solid var(--primary); }
        .recipe-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .recipe-title { font-size: 18px; font-weight: bold; margin: 0; }
        .badge { background: #ff475715; color: var(--primary); padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }
        
        .recipe-details { font-size: 13px; color: #57606f; margin-bottom: 12px; }
        ol { padding-left: 20px; font-size: 14px; line-height: 1.5; color: #333; }
        ol li { margin-bottom: 6px; }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <h1>MatchCulinário 🥗</h1>
            <p>Escope sua geladeira e descubra pratos incríveis agora</p>
        </header>

        <div class="upload-box" onclick="document.getElementById('cameraInput').click()">
            <p style="margin: 0 0 15px 0; font-size: 15px; font-weight: 600;">📷 Tire uma foto da geladeira ou prateleira</p>
            <button class="btn-principal">Abrir Câmera / Galeria</button>
        </div>

        <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="enviarFoto(this)">

        <div id="loading">✨ Analisando ingredientes e cruzando receitas...</div>

        <div id="conteudoResultado"></div>
    </div>

    <script>
        async function enviarFoto(input) {
            if (!input.files || !input.files[0]) return;

            const loading = document.getElementById('loading');
            const resultado = document.getElementById('conteudoResultado');
            
            loading.style.display = 'block';
            resultado.innerHTML = '';

            const formData = new FormData();
            formData.append('foto', input.files[0]);

            try {
                const resposta = await fetch('/api/analisar-geladeira', {
                    method: 'POST',
                    body: formData
                });
                const dados = await resposta.json();

                loading.style.display = 'none';

                if (dados.sucesso) {
                    let html = `<div class="section-title">🔍 Ingredientes Detectados:</div><div class="tags-container">`;
                    dados.ingredientes.forEach(item => {
                        html += `<span class="tag">${item}</span>`;
                    });
                    html += `</div><div class="section-title">🍲 Receitas Recomendadas para Você:</div>`;

                    dados.receitas.forEach(r => {
                        html += `
                            <div class="recipe-card">
                                <div class="recipe-header">
                                    <h3 class="recipe-title">${r.nome}</h3>
                                    <span class="badge">Match: ${r.compatibilidade}</span>
                                </div>
                                <div class="recipe-details">
                                    ⏱️ Tempo: ${r.tempo} | 📊 Dificuldade: ${r.dificuldade}<br>
                                    ⚠️ Faltando: ${r.ingredientesFaltantes.join(', ')}
                                </div>
                                <p style="font-weight: bold; font-size: 13px; margin: 5px 0;">Modo de Preparo:</p>
                                <ol>
                                    ${r.modoPreparo.map(passo => `<li>${passo}</li>`).join('')}
                                </ol>
                            </div>
                        `;
                    });

                    resultado.innerHTML = html;
                } else {
                    resultado.innerHTML = "<p style='color:red; text-align:center;'>Erro ao analisar imagem. Tente novamente.</p>";
                }
            } catch (err) {
                loading.style.display = 'none';
                resultado.innerHTML = "<p style='color:red; text-align:center;'>Erro de conexão com o servidor.</p>";
            }
        }
    </script>
</body>
</html>
